# =====================================================================
# Management Service CI
#
# 목적: management-service 코드가 push/PR 될 때마다
#       빌드 → 테스트 → (push일 때만) 도커 이미지 빌드 → ECR push 까지 자동화한다.
#
# 전제 조건:
#   - infra/terraform/ecr.tf 로 ECR 저장소(management-service)가 미리 생성돼 있어야 함
#   - GitHub Secrets에 아래 값들이 등록돼 있어야 함:
#       DB_APP_PASSWORD, DB_MIGRATOR_PASSWORD, DB_READONLY_PASSWORD
#       JWT_SECRET, KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET, KAKAO_REDIRECT_URI
#       AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# =====================================================================

name: Management Service CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'src/management-service/**'
      - '.github/workflows/management-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/management-service/**'
      - '.github/workflows/management-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # GitHub Actions가 테스트 실행 전, 임시로 MySQL/Redis 컨테이너를 띄워준다.
    # 로컬에서 docker compose up -d mysql redis 하던 것과 동일한 역할을,
    # CI 서버 안에서 매번 자동으로 대신 해주는 것.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shortlink
        ports:
          - 3306:3306
        # 주의: GitHub Actions의 services.options는 "docker create" 옵션만 지원한다.
        # --default-time-zone 은 MySQL 서버 자체에 넘기는 인자라 여기서는 못 쓴다
        # (unknown flag 에러). 그래서 컨테이너는 기본 SYSTEM 타임존으로 뜨고,
        # 대신 아래 "MySQL 타임존/마이그레이션 적용" 스텝에서 --allow-non-utc로
        # run-migration.sh의 UTC 검증을 우회한다. 실제 로컬/운영(docker-compose)은
        # 여전히 UTC로 강제되므로 이 우회는 CI 전용.
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. GitHub 저장소의 코드를 CI 서버(가상 컴퓨터)로 내려받는다.
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. CI 서버는 매번 완전히 새로 생성되는 빈 컴퓨터이므로 JDK를 매번 새로 설치.
      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 의존성 캐시 (두 번째 실행부터 빌드 속도 향상)
      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      # 4. 로컬의 run-migration.sh를 CI가 대신 실행.
      #    --allow-non-utc: 위 mysql 서비스가 SYSTEM 타임존으로 뜨기 때문에
      #    (--default-time-zone을 여기서 못 넣으므로) UTC 검증을 건너뛴다.
      - name: MySQL 타임존/마이그레이션 적용
        working-directory: src/db
        env:
          DB_HOST: 127.0.0.1
          DB_ROOT_USER: root
          DB_ROOT_PASSWORD: root
          # APP_PASSWORD는 run-migration.sh가 shortlink_app 계정을 생성할 때 쓰는 값.
          # 아래 "Gradle 빌드 및 테스트" 스텝의 DB_APP_PASSWORD와 반드시 같은 값이어야
          # 앱이 그 계정으로 정상 로그인할 수 있다.
          APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          MIGRATOR_PASSWORD: ${{ secrets.DB_MIGRATOR_PASSWORD }}
          READONLY_PASSWORD: ${{ secrets.DB_READONLY_PASSWORD }}
        run: |
          chmod +x run-migration.sh
          ./run-migration.sh --allow-non-utc

      # 5. 핵심 스텝. ./gradlew build 하나가:
      #      (1) 코드 컴파일  (2) 전체 테스트 실행  (3) 실행용 jar 생성
      #    을 한 번에 처리한다. (build.gradle에서 plain jar는 비활성화해둠 —
      #    Dockerfile의 COPY build/libs/*.jar 가 파일 여러 개를 잡는 문제 방지)
      - name: Gradle 빌드 및 테스트
        working-directory: src/management-service
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: shortlink
          DB_APP_USER: shortlink_app
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
        run: |
          chmod +x ./gradlew
          ./gradlew build

      # 6. 테스트 실패 시에도 원인 파악용 리포트를 남겨둔다.
      - name: 테스트 결과 업로드 (실패 시에도 확인 가능하게)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/management-service/build/reports/tests/
          retention-days: 5

      # ===================================================================
      # 여기서부터 도커 이미지 빌드 + ECR push.
      # if: github.event_name == 'push' — PR 단계에서는 이미지 안 올림(비용/공간 낭비 방지),
      # develop/main에 실제로 merge된 시점에만 실행.
      # ===================================================================

      - name: AWS 자격증명 설정
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECR 로그인
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Dockerfile은 이미 만들어진 jar를 그대로 복사만 하는 구조이므로,
      # 이 시점엔 5번 스텝에서 만든 build/libs/*.jar가 이미 존재해야 한다(순서 중요).
      # 이미지 태그는 커밋 해시(github.sha)로 붙여 추적 가능하게 하고, latest도 같이 push.
      - name: 도커 이미지 빌드 및 ECR push
        if: github.event_name == 'push'
        working-directory: src/management-service
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: management-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest