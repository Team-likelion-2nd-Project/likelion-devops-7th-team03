name: shortlink

services:
  mysql:
    image: mysql:8.0
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-shortlink}
      MYSQL_USER: ${DB_APP_USER:-shortlink_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  management-service:
    build:
      context: ./src/management-service
    environment:
      # 컨테이너에서는 localhost가 아닌 Compose 서비스명으로 접속한다.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_APP_USER: ${DB_APP_USER:-shortlink_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIRECT_CACHE_TTL: ${REDIRECT_CACHE_TTL:-10m}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-1800}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-1209600}
      SHORT_URL_BASE_URL: ${SHORT_URL_BASE_URL}
    ports:
      - "${MANAGEMENT_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  redirect-service:
    build:
      context: .
      dockerfile: src/redirect-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_APP_USER: ${DB_APP_USER:-shortlink_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-shortlink_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIRECT_CACHE_TTL: ${REDIRECT_CACHE_TTL:-10m}
      REDIRECT_LOG_LEVEL: ${REDIRECT_LOG_LEVEL:-DEBUG}
      CLICK_LOG_SECURE_COOKIE: ${CLICK_LOG_SECURE_COOKIE:-false}
    ports:
      - "${REDIRECTOR_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
