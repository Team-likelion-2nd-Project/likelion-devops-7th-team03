name: shortlink

services:
  mysql:
    image: mysql:8.0
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-shortlink}
      MYSQL_USER: ${DB_APP_USER:-shortlink_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # management-service:
  #   build:
  #     context: ./src/management-service
  #   env_file:
  #     - .env
  #   ports:
  #     - "${MANAGEMENT_PORT:-8080}:8080"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started

  redirect-service:
    build:
      context: .
      dockerfile: src/redirect-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_USERNAME: ${DB_APP_USER:-shortlink_app}
      APP_PASSWORD: ${DB_APP_PASSWORD}
      # 로컬 MySQL이 만드는 앱 계정으로 Flyway도 실행한다.
      MIGRATOR_USERNAME: ${DB_APP_USER:-shortlink_app}
      MIGRATOR_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIRECT_LOG_LEVEL: ${REDIRECT_LOG_LEVEL:-DEBUG}
      CLICK_LOG_SECURE_COOKIE: ${CLICK_LOG_SECURE_COOKIE:-false}
    ports:
      - "${REDIRECTOR_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql-data:
