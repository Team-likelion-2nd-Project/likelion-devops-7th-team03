apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-dev-observability
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 88.5.0
    helm:
      releaseName: kube-prometheus
      values: |
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            enableRemoteWriteReceiver: true
            retention: 3d
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits: { cpu: 500m, memory: 1Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests: { storage: 5Gi }
        grafana:
          admin:
            existingSecret: grafana-admin-credentials
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          persistence:
            enabled: true
            storageClassName: gp3
            size: 2Gi
        alertmanager:
          enabled: false
        # grafana-admin-credentials 시크릿을 수동 kubectl create 없이 ESO로 자동 생성.
        # aws_secretsmanager_secret.grafana_admin_password (modules/app-secrets)를 그대로 당겨온다.
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-admin-credentials
            spec:
              secretStoreRef:
                name: aws-secrets-manager
                kind: ClusterSecretStore
              target:
                name: grafana-admin-credentials
                template:
                  data:
                    admin-user: admin
              data:
                - secretKey: admin-password
                  remoteRef:
                    key: snipy-dev-cluster/app/grafana-admin-password
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
