# KST 02:00에 "어제(KST) 하루치"를 집계한다. UTC로는 전날 17:00.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: athena-batch
  labels: { app: athena-batch }
spec:
  schedule: "0 17 * * *"   # KST 02:00, 매일 1회
  concurrencyPolicy: Forbid       # 이전 실행이 아직 안 끝났으면 새 실행 건너뜀 (같은 날짜 중복 집계 방지)
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900  # 15분 넘으면 강제 종료 (Athena 폴링 무한 대기 방지)
      template:
        metadata:
          labels: { app: athena-batch }
        spec:
          serviceAccountName: athena-batch-sa
          restartPolicy: Never
          containers:
            - name: athena-batch
              # management-service와 같은 이미지 — 프로필만 다르게 실행
              image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/management-service:latest
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: batch
              envFrom:
                - configMapRef: { name: management-service-config }
                - secretRef: { name: management-service-secrets }
                - configMapRef: { name: athena-batch-config }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits:   { cpu: 500m, memory: 1Gi }
