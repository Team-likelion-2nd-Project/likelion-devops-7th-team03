apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect-service
  labels: { app: redirect-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: redirect-service }
  template:
    metadata:
      labels: { app: redirect-service }
    spec:
      serviceAccountName: redirect-service-sa
      containers:
        - name: redirect-service
          image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/redirect-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: redirect-service-config }
            - secretRef: { name: redirect-service-secrets }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            # limit 500m는 부하테스트 중 CPU 100% 소진 + 쓰로틀링(초당 10~20회)이 관측됨.
            # request(HPA 기준값, 250m)는 그대로 두고 limit만 올려서 스케일아웃 타이밍은
            # 유지하면서 HPA가 반응하는 몇 초간의 버스트를 쓰로틀 없이 버티게 한다.
            limits:   { cpu: 1000m, memory: 1Gi }