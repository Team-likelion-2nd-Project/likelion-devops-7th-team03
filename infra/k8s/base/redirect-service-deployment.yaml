apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect-service
  labels: { app: redirect-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: redirect-service }
  template:
    metadata:
      labels: { app: redirect-service }
    spec:
      serviceAccountName: redirect-service-sa
      containers:
        - name: redirect-service
          image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/redirect-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: redirect-service-config }
            - secretRef: { name: redirect-service-secrets }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          resources:
            # request 250m가 너무 낮아서 스케줄러가 파드를 한 노드(t3.medium, 2vCPU)에
            # 3개까지 욱여넣었고, 부하 중 그 노드 자체가 CPU 100%까지 참 — limit을
            # 1000m로 올려도 물리 코어를 나눠 쓰는 파드끼리 계속 쓰로틀됨. request를
            # 올려서 노드당 밀도를 낮추고, 여유가 없어지면 cluster-autoscaler가 실제로
            # 노드를 늘리도록 유도한다.
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 1Gi }