spring:
  application:
    name: management-service

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:shortlink}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_APP_USER:shortlink_app}
    password: ${DB_APP_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate    # 스키마는 run-migration.sh가 만듦. 앱은 검증만
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false          # 마이그레이션은 run-migration.sh가 실행 (README "권장" 방식)
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

app:
  redirect-cache:
    ttl: ${REDIRECT_CACHE_TTL:10m}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1800}
  refresh-token-validity-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:1209600}

# 단축 URL의 공개 주소. 환경마다 다르므로 코드에서 조합할 도메인을 하드코딩하지 않는다.
# 예: 로컬 http://localhost:8080, 운영 https://s.short.ly
short-url:
  base-url: ${SHORT_URL_BASE_URL}
