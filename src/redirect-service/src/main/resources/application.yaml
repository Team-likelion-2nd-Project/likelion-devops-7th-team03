spring:
  application:
    name: redirect-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME:shortlink_app}
    password: ${APP_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${MIGRATOR_USERNAME:shortlink_migrator}
    password: ${MIGRATOR_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  redirect-cache:
    ttl: ${REDIRECT_CACHE_TTL:10m}

  click-log:
    secure-cookie: ${CLICK_LOG_SECURE_COOKIE:false}

logging:
  level:
    redirect_service.redirect: ${REDIRECT_LOG_LEVEL:INFO}
