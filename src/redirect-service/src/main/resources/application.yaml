spring:
  application:
    name: redirect-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_APP_USER:shortlink_app}
    password: ${DB_APP_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_MIGRATOR_USER:shortlink_migrator}
    password: ${DB_MIGRATOR_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  redirect-cache:
    # management-service와 같은 값으로 유지한다. Compose에서는 .env의 값을 주입한다.
    ttl: ${REDIRECT_CACHE_TTL:10m}

  click-log:
    secure-cookie: ${CLICK_LOG_SECURE_COOKIE:false}

  realtime-stats:
    # Redis는 당일 잠정 통계만 보관한다. 원본 클릭 이벤트가 최종 집계의 기준이다.
    retention: ${REALTIME_STATS_RETENTION:3d}
    flush-interval: ${REALTIME_STATS_FLUSH_INTERVAL:5s}
    buffer-capacity: ${REALTIME_STATS_BUFFER_CAPACITY:100000}

logging:
  level:
    redirect_service.redirect: ${REDIRECT_LOG_LEVEL:INFO}
